name: update

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *' # elke 4 uur verse data; weghalen zodra het seizoen voorbij is

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verse weerdata ophalen (alle festivals)
        run: bun scripts/fetch-data.ts
      - name: Site bouwen (festivals + landing)
        run: bun scripts/build-site.ts
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
